# Surcharge du Traefik installé par k3s (HelmChartConfig, mécanisme prévu par k3s) :
# une copie par nœud et l'IP virtuelle fixe.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: {{ .Values.traefikReplicas }}
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    service:
      annotations:
        metallb.io/loadBalancerIPs: {{ .Values.traefikIP }}
