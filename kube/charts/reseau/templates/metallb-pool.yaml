# Mode L2 : le nœud qui porte une IP répond aux requêtes ARP pour elle ;
# s'il tombe, un autre nœud reprend l'IP.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan199
  namespace: metallb-system
spec:
  addresses: {{ toJson .Values.pool }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vlan199
  namespace: metallb-system
spec:
  ipAddressPools: [vlan199]
