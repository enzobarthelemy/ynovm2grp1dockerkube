# Seuls les namespaces listés peuvent joindre le serveur Vault (ex-réseau net_vault)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ .Values.allowedNamespaces | toJson }}
      ports:
        - { protocol: TCP, port: 8200 }
