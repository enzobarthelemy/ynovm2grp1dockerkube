apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-unsealer
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: vault-unsealer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vault-unsealer }
    spec:
      automountServiceAccountToken: false
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: unsealer
          image: {{ .Values.image }}
          command: ["/bin/sh", "/config/unseal.sh"]
          env:
            - { name: VAULT_ADDR, value: {{ .Values.vaultAddr | quote }} }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: keys, mountPath: /keys, readOnly: true }
      volumes:
        - name: config
          configMap: { name: vault-bootstrap }
        - name: keys
          secret:
            secretName: {{ .Values.keysSecretName }}
            optional: true   # le Secret n'existe qu'après l'init : le pod démarre quand même
