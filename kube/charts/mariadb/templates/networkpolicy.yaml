# Dès qu'un pod est ciblé par une NetworkPolicy Ingress, tout ce qui n'est pas autorisé est refusé.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ .Values.allowFrom | toJson }}
      ports:
        - { protocol: TCP, port: 3306 }
