# Chart kube-prometheus-stack : Prometheus Operator + Prometheus + Grafana
# + node-exporter + kube-state-metrics. cAdvisor est déjà dans le kubelet.

alertmanager:
  enabled: false          # absent du compose

# Sur k3s ces composants sont intégrés au binaire k3s et ne sont pas
# scrapables séparément : on les désactive pour éviter des cibles en erreur.
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
kubeProxy:             { enabled: false }
kubeEtcd:              { enabled: false }

prometheus:
  prometheusSpec:
    retention: 7d
    # L'opérateur laisse 600 s d'arrêt à Prometheus ; Longhorn n'efface un pod bloqué
    # sur un nœud mort qu'après ce délai -> ~16 min de bascule. 60 s suffisent ici.
    terminationGracePeriodSeconds: 60
    tolerations:
      - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
    storageSpec:          # ex-volume prometheus_data
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

  # Trois sources de plus pour le tableau de bord : Traefik (trafic par site),
  # Longhorn (état des volumes) et Vault (scellé ou non). Le chart y ajoute le label release: monitoring,
  # celui que Prometheus sélectionne.
  additionalPodMonitors:
    - name: traefik
      namespaceSelector: { matchNames: [kube-system] }
      selector: { matchLabels: { app.kubernetes.io/name: traefik } }
      podMetricsEndpoints: [{ port: metrics }]
  additionalServiceMonitors:
    - name: longhorn
      namespaceSelector: { matchNames: [longhorn-system] }
      selector: { matchLabels: { app: longhorn-manager } }   # service longhorn-backend
      endpoints: [{ port: manager }]
    # Vault : seule source fiable de son état scellé (son pod est « prêt » même scellé).
    # Déclaré ici et non dans le chart Vault, installé avant les CRD de la supervision.
    - name: vault
      namespaceSelector: { matchNames: [vault] }
      selector:
        matchLabels: { app.kubernetes.io/name: vault }
        matchExpressions: [{ key: vault-internal, operator: DoesNotExist }]   # service « vault » seul
      endpoints:
        - port: http
          path: /v1/sys/metrics
          params: { format: [prometheus] }

# Les managers Longhorn n'acceptent que le trafic des pods Longhorn (NetworkPolicy
# du chart Longhorn) : on ouvre leur port de métriques à Prometheus.
extraManifests:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-prometheus-metrics
      namespace: longhorn-system
    spec:
      podSelector: { matchLabels: { app: longhorn-manager } }
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
              podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
          ports: [{ port: 9500, protocol: TCP }]

grafana:
  # Le chart fournit ~25 tableaux de bord très détaillés (plus des modèles pour AIX et
  # macOS). On les remplace par un seul, fait pour le lab : charts/dashboards.
  defaultDashboardsEnabled: false
  grafana.ini:
    dashboards:
      # page d'accueil = ce tableau de bord (fichier écrit par le sidecar)
      default_home_dashboard_path: /tmp/dashboards/vue-ensemble.json

  # Par défaut Kubernetes attend 300 s avant de recréer ailleurs un pod dont le nœud
  # ne répond plus. Les volumes étant répliqués (Longhorn), on repart après 30 s.
  tolerations:
    - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
    - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
  serviceAccount:
    create: true
    name: grafana         # nom attendu par le rôle Vault "grafana"

  # Injection du mot de passe admin depuis Vault -> /vault/secrets/admin_password
  podAnnotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-pre-populate-only: "true"
    vault.hashicorp.com/role: "grafana"
    vault.hashicorp.com/auth-max-backoff: "5s"
    vault.hashicorp.com/agent-inject-secret-admin_password: "secret/data/grafana/admin"
    vault.hashicorp.com/agent-inject-template-admin_password: |
      {{- with secret "secret/data/grafana/admin" -}}{{ .Data.data.admin_password }}{{- end -}}

  # Avec ces deux variables, le chart ne génère pas son propre Secret admin
  env:
    GF_SECURITY_ADMIN_USER: admin
    # Image Grafana distroless (chart récent) : *__FILE n'est plus supporté,
    # on passe par l'expansion de variables de Grafana $__file{}
    GF_SECURITY_ADMIN_PASSWORD: "$__file{/vault/secrets/admin_password}"
    GF_SERVER_DOMAIN: monitor.appart.cbarreda.fr
    GF_SERVER_ROOT_URL: https://monitor.appart.cbarreda.fr:8443/

  persistence:            # ex-volume grafana_data
    enabled: true
    size: 1Gi

  ingress:                # ex-labels traefik
    enabled: true
    ingressClassName: traefik
    hosts: [monitor.appart.cbarreda.fr]
    path: /
