# /var/lib/rancher/k3s/server/manifests/metallb.yaml (k8s-01) : k3s installe le chart tout seul.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: metallb
  namespace: kube-system
spec:
  repo: https://metallb.github.io/metallb
  chart: metallb
  version: 0.16.2
  targetNamespace: metallb-system
  createNamespace: true
