name: CI/CD WordPress

# ---------------------------------------------------------------------------
# Déclencheur : chaque push (toutes branches).
#   - CI (build + scan Trivy) sur toutes les branches, runner GitHub hébergé.
#   - Publication de l'image sur GHCR + CD uniquement sur main.
#   - Le CD tourne sur un runner self-hosted installé SUR le serveur de
#     déploiement : plus de SSH, les commandes s'exécutent localement.
#
# Prérequis sur le serveur (une seule fois) :
#   - runner GitHub Actions installé en service (./svc.sh install && ./svc.sh start)
#     avec les labels "self-hosted" et "linux" ;
#   - l'utilisateur du runner est membre du groupe docker (sudo usermod -aG docker <user>,
#     puis redémarrer le service du runner) ;
#   - l'utilisateur du runner peut écrire dans DEPLOY_PATH.
# ---------------------------------------------------------------------------
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Un seul déploiement à la fois par branche, sans annuler celui en cours.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GitHub Container Registry (le nom doit être en minuscules)
  IMAGE_NAME: ghcr.io/enzobarthelemy/ynovm2dockerwp
  TRIVY_VERSION: "0.76.0"

jobs:
  # =========================================================================
  # CI
  # =========================================================================
  ci:
    name: CI - Build et scan de l'image WordPress
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # publication sur ghcr.io avec GITHUB_TOKEN
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v6

      - name: Calcul du tag de l'image
        id: meta
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image : ${IMAGE_NAME}:${TAG}"

      - name: CI - Compilation de l'image (docker build)
        run: |
          docker build \
            --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=Image WordPress personnalisée ynovm2grp1dockerkube" \
            --tag "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            customwp
          docker image ls "${IMAGE_NAME}"

      - name: CI - Scan avec Trivy (vulnérabilités HIGH/CRITICAL + secrets)
        run: |
          set -o pipefail
          mkdir -p "${HOME}/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              --format table \
              "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            | tee trivy-report.txt

      - name: Archivage du rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ steps.meta.outputs.tag }}
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: CI - Connexion à GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CI - Publication de l'image sur ghcr.io (après un scan réussi)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          docker tag  "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

  # =========================================================================
  # CD (runner self-hosted sur le serveur de déploiement)
  # =========================================================================
  cd:
    name: CD - Déploiement sur le serveur (self-hosted)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read           # pull de l'image privée depuis ghcr.io
    env:
      IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/ynovm2grp1dockerkube' }}

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v6
        with:
          clean: true

      - name: CD - Contrôle de l'environnement du runner
        run: |
          echo "Runner : $(hostname) - utilisateur $(whoami)"
          if ! docker info >/dev/null 2>&1; then
            echo "::error::L'utilisateur '$(whoami)' n'a pas accès au démon Docker. Ajouter l'utilisateur au groupe docker (sudo usermod -aG docker $(whoami)) puis redémarrer le service du runner."
            exit 1
          fi
          mkdir -p "${DEPLOY_PATH}"
          if [ ! -w "${DEPLOY_PATH}" ]; then
            echo "::error::Le dossier ${DEPLOY_PATH} n'est pas accessible en écriture par '$(whoami)'."
            exit 1
          fi

          # Configuration Docker isolée et propre au job : les identifiants
          # ghcr.io ne sont jamais écrits dans ~/.docker du runner.
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          install -m 700 -d "${DOCKER_CONFIG_DIR}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG_DIR}" >> "$GITHUB_ENV"

      - name: CD - Vérification de l'installation de Docker
        run: bash .github/scripts/remote-check-docker.sh

      - name: CD - Connexion à ghcr.io (jeton temporaire du job)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Jeton transmis par stdin, stocké uniquement dans DOCKER_CONFIG
          # (dossier temporaire du job). Il expire à la fin du job.
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: CD - Déploiement du docker-compose
        env:
          CD_MARIADB_USER: ${{ vars.MARIADB_USER }}
          CD_MARIADB_DATABASE: ${{ vars.MARIADB_DATABASE }}
          CD_WORDPRESS_DB_NAME: ${{ vars.WORDPRESS_DB_NAME }}
          CD_WORDPRESS_DB_USER: ${{ vars.WORDPRESS_DB_USER }}
        run: |
          # Copie des fichiers de la stack dans DEPLOY_PATH. Les secrets Vault
          # déjà générés (vault/init-out, vault/approle) et le .env ne sont
          # jamais écrasés : tar n'ajoute / ne remplace que ces fichiers.
          tar -cf - \
              docker-compose.yaml \
              prometheus.yml \
              grafana \
              vault/config vault/agent vault/init.sh \
            | tar -xf - -C "${DEPLOY_PATH}"

          # Préfixe CD_ : ces valeurs ne servent qu'à créer le .env. Sous leur
          # vrai nom, elles seraient prioritaires sur le .env pour docker
          # compose et écraseraient la configuration du serveur.
          bash .github/scripts/remote-deploy.sh

      - name: CD - Vérification des healthchecks
        env:
          HEALTH_TIMEOUT: "300"
        run: bash .github/scripts/remote-healthcheck.sh

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Déploiement WordPress"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_NAME}:${IMAGE_TAG}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Serveur | \`$(hostname)\` |"
            echo "| Dossier serveur | \`${DEPLOY_PATH}\` |"
            echo "| Résultat | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage (déconnexion ghcr.io, configuration Docker temporaire)
        if: always()
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            docker logout ghcr.io || true
            rm -rf "${DOCKER_CONFIG}"
          fi
          # Images WordPress obsolètes (garde celles utilisées par les conteneurs)
          docker image prune -f --filter "label=org.opencontainers.image.description=Image WordPress personnalisée ynovm2grp1dockerkube" || true
