name: ynovm2grp1dockerkube   # nom de projet fixe (préfixe des volumes, filtre du dashboard Grafana)

services:

  # ===========================================================================
  # Reverse proxy
  # ===========================================================================

  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true          # sert le dashboard sur :8080 (labo uniquement)
    ports:
      - "80:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - net_ext

  # ===========================================================================
  # Nextcloud
  # ===========================================================================

  mariadb:
    image: mariadb:lts-ubi10
    container_name: nextcloud-db
    volumes:
      - nextcloud_db_data:/var/lib/mysql
      - nc_secrets:/run/vault:ro
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/vault/db_root_password
      MARIADB_USER_FILE: /run/vault/db_user
      MARIADB_PASSWORD_FILE: /run/vault/db_password
      MARIADB_DATABASE_FILE: /run/vault/db_name
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      vault-agent-nextcloud: { condition: service_healthy }
    restart: always
    networks:
      - net_db

  nextcloud:
    image: nextcloud:32.0.15-apache
    container_name: nextcloud
    volumes:
      - nextcloud_data:/var/www/html
      - nc_secrets:/run/vault:ro
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE_FILE: /run/vault/db_name
      MYSQL_USER_FILE: /run/vault/db_user
      MYSQL_PASSWORD_FILE: /run/vault/db_password
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - net_ext
      - net_db
    labels:
      - traefik.enable=true
      - traefik.docker.network=net_ext
      - traefik.http.routers.nextcloud.rule=Host(`cloud.ynovm2.lab`)
      - traefik.http.routers.nextcloud.entrypoints=web
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

  # ===========================================================================
  # WordPress
  # ===========================================================================

  wordpress-db:
    image: mariadb:lts-ubi10
    container_name: wordpress-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD_FILE: /run/vault/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/vault/db_root_password
    volumes:
      - wordpress_db_data:/var/lib/mysql
      - wp_secrets:/run/vault:ro
    networks:
      - net_db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      vault-agent-wordpress: { condition: service_healthy }

  wordpress:
    image: ebynov/ynovm2dockerwp:1.2.1
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/vault/db_password
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    volumes:
      - wordpress_data:/var/www/html
      - wp_secrets:/run/vault:ro
    networks:
      - net_db
      - net_ext
    labels:
      - traefik.enable=true
      - traefik.docker.network=net_ext
      - traefik.http.routers.wordpress.rule=Host(`wp.ynovm2.lab`)
      - traefik.http.routers.wordpress.entrypoints=web
      - traefik.http.services.wordpress.loadbalancer.server.port=8080

  # ===========================================================================
  # Vault (gestion des secrets)
  # ===========================================================================

  vault:
    image: hashicorp/vault:1.13.3
    container_name: vault
    command: server
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:8200:8200"]
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/file
    networks: [net_vault]
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:1.13.3
    container_name: vault-init
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./vault/init.sh:/init.sh:ro
      - ./vault/init-out:/init-out
      - ./vault/approle:/approle
    depends_on: [vault]
    networks: [net_vault]
    environment:
      NC_DB_NAME: ${MARIADB_DATABASE}
      NC_DB_USER: ${MARIADB_USER}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      retries: 30

  vault-agent-wordpress:
    image: hashicorp/vault:1.13.3
    container_name: vault-agent-wp
    command: agent -config=/vault/agent/agent.hcl
    restart: unless-stopped
    depends_on:
      vault-init: { condition: service_healthy }
    networks: [net_vault]
    volumes:
      - ./vault/agent/wordpress.hcl:/vault/agent/agent.hcl:ro
      - ./vault/approle/wordpress:/vault/approle:ro
      - wp_secrets:/secrets
    healthcheck:
      test: ["CMD", "test", "-s", "/secrets/db_password"]
      interval: 5s
      retries: 30

  vault-agent-nextcloud:
    image: hashicorp/vault:1.13.3
    container_name: vault-agent-nc
    command: agent -config=/vault/agent/agent.hcl
    restart: unless-stopped
    depends_on:
      vault-init: { condition: service_healthy }
    networks: [net_vault]
    volumes:
      - ./vault/agent/nextcloud.hcl:/vault/agent/agent.hcl:ro
      - ./vault/approle/nextcloud:/vault/approle:ro
      - nc_secrets:/secrets
    healthcheck:
      test: ["CMD-SHELL", "test -s /secrets/db_password && test -s /secrets/db_name && test -s /secrets/db_user"]
      interval: 5s
      retries: 30

  vault-agent-grafana:
    image: hashicorp/vault:1.13.3
    container_name: vault-agent-grafana
    command: agent -config=/vault/agent/agent.hcl
    restart: unless-stopped
    depends_on:
      vault-init: { condition: service_healthy }
    networks: [net_vault]
    volumes:
      - ./vault/agent/grafana.hcl:/vault/agent/agent.hcl:ro
      - ./vault/approle/grafana:/vault/approle:ro
      - grafana_secrets:/secrets
    healthcheck:
      test: ["CMD", "test", "-s", "/secrets/admin_password"]
      interval: 5s
      retries: 30

  # ===========================================================================
  # Supervision
  # ===========================================================================

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    privileged: true
    cgroup: host
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped
    depends_on:
      - cadvisor
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/vault/admin_password
      GF_SERVER_DOMAIN: monitor.ynovm2.lab
      GF_SERVER_ROOT_URL: http://monitor.ynovm2.lab/
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_secrets:/run/vault:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      vault-agent-grafana:
        condition: service_healthy
    networks:
      - monitoring
      - net_ext
    labels:
      - traefik.enable=true
      - traefik.docker.network=net_ext
      - traefik.http.routers.grafana.rule=Host(`monitor.ynovm2.lab`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000

networks:
  net_ext:
    name: net_ext
    driver: bridge
  net_db:
    name: net_db
    driver: bridge
  net_vault:
    name: net_vault
    driver: bridge
  monitoring:
    name: monitoring
    driver: bridge

volumes:
  nextcloud_db_data:
  nextcloud_data:
  wordpress_db_data:
  wordpress_data:
  vault_data:
  prometheus_data:
  grafana_data:
  wp_secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  nc_secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
  grafana_secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs }
